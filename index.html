<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Walid Hamzaoui</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; 
        }
        header {
            background-color: #16213e; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .logo span {
            color: #4361ee; 
            font-weight: normal;
        }
        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            margin-left: 30px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #4361ee;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Walid HAMZAOUI <span>SIO SISR</span></div>
        <nav>
            <ul>
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#epreuve-e5">Epreuve E5</a></li>
                <li><a href="#epreuve-e6">Epreuve E6</a></li>
                <li><a href="#entreprise">Entreprise</a></li>
                <li><a href="#veille">Veille Technologique</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
