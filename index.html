<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Walid Hamzaoui</title>
    <style>
        /* Couleurs de base : Noir et Orange Iris */
        :root {
            --bg-color: #050505; 
            --header-bg: #111111;
            --primary-orange: #ff6600; 
            --card-bg: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            --text-light: #ffffff; 
            --text-muted: #a0a0a0; 
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
        }

        /* Barre de navigation */
        header {
            background-color: var(--header-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            color: var(--primary-orange);
            font-weight: normal;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary-orange);
        }

        /* Section Accueil - Style Carte */
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            min-height: 70vh;
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px; /* Coins arrondis comme sur ton image */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px 70px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(255, 102, 0, 0.05); /* Léger reflet orange */
        }

        .hero-text {
            max-width: 55%;
        }

        .hero-text h1 {
            font-size: 55px;
            margin: 0 0 10px 0;
            line-height: 1.1;
        }

        .hero-text h2 {
            font-size: 22px;
            font-weight: normal;
            margin: 0 0 20px 0;
        }

        .hero-text .status {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 5px;
        }

        .hero-text .job {
            color: var(--primary-orange);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Boutons arrondis (Pills) */
        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn-pill {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px; /* Boutons en forme de pilule */
            border: 1px solid #fff;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-pill:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
            background-color: rgba(255, 102, 0, 0.05);
        }

        /* Photo circulaire */
        .hero-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-circle {
            width: 280px;
            height: 280px;
            background-color: #222;
            border-radius: 50%;
            border: 4px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Walid HAMZAOUI <span>SIO SISR</span></div>
        <nav>
            <ul>
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#epreuve-e5">Epreuve E5</a></li>
                <li><a href="#epreuve-e6">Epreuve E6</a></li>
                <li><a href="#entreprise">Entreprise</a></li>
                <li><a href="#veille">Veille Technologique</a></li>
            </ul>
        </nav>
    </header>

    <section id="accueil" class="hero-section">
        <div class="hero-card">
            <div class="hero-text">
                <h1>Walid<br>HAMZAOUI</h1>
                <h2>Étudiant en BTS SIO SISR</h2>
                
                <div class="status">À la recherche d'une alternance</div>
                <div class="job">Support Informatique & Systèmes</div>
                
                <div class="buttons">
                    <a href="#profil" class="btn-pill">Profil</a>
                    <a href="#certification" class="btn-pill">Certification</a>
                    <a href="#contact" class="btn-pill">Contacter</a>
                </div>
            </div>
            
            <div class="hero-image">
                <div class="photo-circle">Photo à venir</div>
            </div>
        </div>
    </section>

</body>
</html>
