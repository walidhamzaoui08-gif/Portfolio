<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Walid Hamzaoui</title>
    <style>
        :root {
            --bg-color: #080808; 
            --section-bg: #121212;
            --primary-orange: #ff6600; 
            --orange-glow: rgba(255, 102, 0, 0.3);
            --text-light: #ffffff; 
            --text-muted: #888888; 
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            scroll-behavior: smooth;
        }

        /* --- Navigation --- */
        header {
            background-color: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-orange);
            font-weight: 400;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary-orange);
        }

        /* --- Structure globale des sections --- */
        section {
            padding: 100px 10%;
            min-height: 50vh;
        }
