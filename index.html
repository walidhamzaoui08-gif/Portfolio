<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Walid Hamzaoui</title>
    <style>
        :root {
            --bg-color: #080808; 
            --section-bg: #121212;
            --primary-orange: #ff6600; 
            --orange-glow: rgba(255, 102, 0, 0.3);
            --text-light: #ffffff; 
            --text-muted: #888888; 
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            scroll-behavior: smooth; /* Permet un défilement fluide quand on clique sur le menu */
        }

        /* --- Navigation --- */
        header {
            background-color: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 102, 0, 0.2);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--primary-orange);
            font-weight: 400;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: var(--primary-orange);
        }

        /* --- Structure globale des sections --- */
        section {
            padding: 100px 10%;
            min-height: 50vh;
        }

        .section-title {
            font-size: 36px;
            margin-bottom: 50px;
            border-left: 4px solid var(--primary-orange);
            padding-left: 15px;
        }

        /* --- Section Accueil --- */
        #accueil {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 30%, #1a0a00 0%, #080808 70%);
        }

        .bio-content h1 {
            font-size: 65px;
            margin: 0 0 10px 0;
            text-shadow: 0 0 30px var(--orange-glow);
        }

        .bio-content h2 {
            font-size: 24px;
            color: var(--primary-orange);
            margin-top: 0;
        }

        .bio-content p {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.7;
            max-width: 600px;
            margin-bottom: 30px;
        }

        /* --- Section Profil & Compétences --- */
        #profil {
            background-color: var(--section-bg);
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .skill-category {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border-top: 3px solid var(--primary-orange);
        }

        .skill-category h3 {
            margin-top: 0;
            color: #fff;
        }

        .skill-category ul {
            list-style: none;
            padding: 0;
            color: var(--text-muted);
            line-height: 2;
        }

        .skill-category ul li::before {
            content: "▹";
            color: var(--primary-orange);
            margin-right: 10px;
        }

        /* --- Section Projets --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
        }

        .project-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 102, 0, 0.1);
        }

        .project-tags {
            margin-bottom: 15px;
        }

        .tag {
            background: rgba(255, 102, 0, 0.1);
            color: var(--primary-orange);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }

        /* --- Section Expériences (Airsoft / Vinted) --- */
        #experiences {
            background-color: var(--section-bg);
        }

        .exp-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .exp-item {
            display: flex;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 30px;
            border-left: 4px solid #444;
            transition: border-color 0.3s;
        }

        .exp-item:hover {
            border-color: var(--primary-orange);
        }

        .exp-date {
            min-width: 150px;
            color: var(--primary-orange);
            font-weight: bold;
        }

        .exp-details h3 {
            margin: 0 0 10px 0;
        }
        
        .exp-details p {
            color: var(--text-muted);
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>

    <header>
